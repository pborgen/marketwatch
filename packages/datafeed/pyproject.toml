[project]
name = "datafeed"
version = "0.1.0"
description = "Market data clients. Copied from pborgen/invest@68db3164b78746acc9031799c28c67f4f6431cb8."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
