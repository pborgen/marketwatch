[project]
name = "envfile"
version = "0.1.0"
description = "Load KEY=value files into the process environment without overriding variables already set."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
