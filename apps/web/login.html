<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Market Watch</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3efe6;
        --card: #fffdf8;
        --ink: #221e18;
        --muted: #6d6458;
        --line: #e2d9cc;
        --warn: #8d3a32;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, "Segoe UI", sans-serif;
      }

      form {
        width: min(420px, 100%);
        padding: 28px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      h1 {
        margin: 8px 0 12px;
        font-family: Georgia, "Iowan Old Style", serif;
        font-weight: normal;
        font-size: 2.4rem;
      }

      label {
        display: block;
        margin: 22px 0 8px;
        font-size: 0.92rem;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        color: var(--ink);
        font: inherit;
        font-size: 16px;
      }

      input:focus {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      button {
        margin-top: 16px;
        width: 100%;
        padding: 12px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: white;
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .error {
        min-height: 1.4em;
        margin-top: 14px;
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <p>Agent monitor</p>
      <h1>Market Watch</h1>
      <p>Sign in with the shared demo password to see the agents and send them commands.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <p class="error">{{error}}</p>
    </form>
  </body>
</html>
