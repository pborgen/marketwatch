<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Market Watch</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3efe6;
        --card: #fffdf8;
        --ink: #221e18;
        --muted: #6d6458;
        --line: #e2d9cc;
        --ready: #1d6b45;
        --ready-bg: #e5f4ec;
        --warn: #8d3a32;
        --warn-bg: #f8e8e4;
        --idle: #6d6458;
        --idle-bg: #f0ebe3;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, "Segoe UI", sans-serif;
      }

      header, main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        padding: 28px 0 18px;
      }

      h1 {
        margin: 4px 0 0;
        font-family: Georgia, "Iowan Old Style", serif;
        font-weight: normal;
        font-size: 2.4rem;
      }

      .eyebrow, .target, .hint {
        margin: 0;
        color: var(--muted);
      }

      header button, .ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
        padding-bottom: 40px;
      }

      article {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      .title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
      }

      h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 650;
      }

      .pill {
        flex: none;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--idle-bg);
        color: var(--idle);
        font-size: 0.82rem;
      }

      .pill.ready { background: var(--ready-bg); color: var(--ready); }
      .pill.offline, .pill.unavailable { background: var(--warn-bg); color: var(--warn); }

      p { margin: 0; line-height: 1.45; }

      .prompts { display: flex; flex-wrap: wrap; gap: 8px; }

      button, textarea {
        font: inherit;
        font-size: 16px;
      }

      button {
        padding: 8px 12px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: white;
        cursor: pointer;
      }

      button:disabled { opacity: 0.55; cursor: wait; }
      button:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      .prompt {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      textarea {
        width: 100%;
        min-height: 76px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
        color: var(--ink);
      }

      .actions { display: flex; gap: 8px; align-items: center; }

      .log {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }

      .turn {
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .who { font-size: 0.78rem; color: var(--muted); }
      .say { white-space: pre-wrap; margin-top: 4px; }
      .say.bad { color: var(--warn); }

      .banner {
        grid-column: 1 / -1;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--warn-bg);
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Agent monitor</p>
        <h1>Market Watch</h1>
      </div>
      <form method="post" action="/logout">
        <button type="submit">Sign out</button>
      </form>
    </header>
    <main id="agents" aria-live="polite"></main>
    <script>
      const root = document.querySelector("#agents")
      const cards = new Map()

      function pill(status) {
        if (status === "ready") return "Ready"
        if (status === "unavailable") return "Unavailable"
        return "Offline"
      }

      function card(agent) {
        const article = document.createElement("article")
        article.innerHTML = `
          <div class="title">
            <h2></h2>
            <span class="pill"></span>
          </div>
          <p class="about"></p>
          <p class="target"></p>
          <div class="prompts"></div>
          <textarea aria-label="Command" placeholder="Tell this agent what to do"></textarea>
          <div class="actions">
            <button type="button" class="send">Send</button>
            <button type="button" class="ghost reset">New session</button>
          </div>
          <div class="log"></div>
        `
        article.querySelector("h2").textContent = agent.name
        article.querySelector(".about").textContent = agent.description
        article.querySelector("textarea").setAttribute("aria-label", "Command for " + agent.name)
        const prompts = article.querySelector(".prompts")
        for (const prompt of agent.prompts) {
          const button = document.createElement("button")
          button.type = "button"
          button.className = "prompt"
          button.textContent = prompt
          button.addEventListener("click", () => send(agent.id, prompt, false))
          prompts.appendChild(button)
        }
        const box = article.querySelector("textarea")
        article.querySelector(".send").addEventListener("click", () => send(agent.id, box.value, false))
        article.querySelector(".reset").addEventListener("click", () => send(agent.id, "", true))
        box.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault()
            send(agent.id, box.value, false)
          }
        })
        return article
      }

      function paint(agent) {
        let article = cards.get(agent.id)
        if (!article) {
          article = card(agent)
          cards.set(agent.id, article)
          root.appendChild(article)
        }
        const status = article.querySelector(".pill")
        status.textContent = pill(agent.status)
        status.className = "pill " + agent.status
        const target = article.querySelector(".target")
        target.replaceChildren(agent.detail)
        if (agent.target) target.append(document.createElement("br"), agent.target)
      }

      function turn(agentId, who, text, bad) {
        const log = cards.get(agentId).querySelector(".log")
        const block = document.createElement("div")
        block.className = "turn"
        const label = document.createElement("div")
        label.className = "who"
        label.textContent = who
        const say = document.createElement("div")
        say.className = bad ? "say bad" : "say"
        say.textContent = text
        block.append(label, say)
        log.append(block)
      }

      function busy(agentId, on) {
        const article = cards.get(agentId)
        for (const button of article.querySelectorAll("button")) button.disabled = on
      }

      async function send(agentId, prompt, reset) {
        const article = cards.get(agentId)
        const box = article.querySelector("textarea")
        const text = prompt.trim()
        if (!text && !reset) return
        busy(agentId, true)
        try {
          const response = await fetch("/api/agents/" + agentId + "/commands", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text, reset })
          })
          if (response.status === 401) {
            location.href = "/"
            return
          }
          const payload = await response.json()
          if (text) turn(agentId, "You", text, false)
          if (payload.ok) {
            if (reset && !text) article.querySelector(".log").replaceChildren()
            if (text) box.value = ""
            turn(agentId, "Agent", payload.result || "Done.", false)
          } else {
            turn(agentId, "Agent", payload.error || "The command failed.", true)
          }
        } catch {
          turn(agentId, "Agent", "The monitor could not reach the server.", true)
        } finally {
          busy(agentId, false)
        }
      }

      async function refresh() {
        let response
        try {
          response = await fetch("/api/agents")
        } catch {
          banner("The monitor could not refresh agent status.")
          return
        }
        if (response.status === 401) {
          location.href = "/"
          return
        }
        const payload = await response.json()
        const seen = new Set()
        for (const agent of payload.agents || []) {
          seen.add(agent.id)
          paint(agent)
        }
        for (const [id, article] of cards) {
          if (!seen.has(id)) {
            article.remove()
            cards.delete(id)
          }
        }
        const note = root.querySelector(".banner")
        if (note) note.remove()
      }

      function banner(text) {
        let note = root.querySelector(".banner")
        if (!note) {
          note = document.createElement("p")
          note.className = "banner"
          root.prepend(note)
        }
        note.textContent = text
      }

      refresh()
      setInterval(refresh, 15000)
    </script>
  </body>
</html>
